<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>ShopEase</h1>

            <button id="cart-toggle">
                Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <main>
        <h2>Our Products</h2>

    <div class="product-controls">

        <input
            type="text"
            id="search-input"
            placeholder="Search products..."
        >

        <div class="category-filters">
            <button class="filter-btn active" data-category="All">
                All
            </button>

            <button class="filter-btn" data-category="Electronics">
                Electronics
            </button>

            <button class="filter-btn" data-category="Clothing">
                Clothing
            </button>

            <button class="filter-btn" data-category="Shoes">
                Shoes
            </button>

            <button class="filter-btn" data-category="Accessories">
                Accessories
            </button>
        </div>

    </div>
    <div class="price-controls">

        <input
            type="number"
            id="min-price"
            placeholder="Min price"
        >

        <input
            type="number"
            id="max-price"
            placeholder="Max price"
        >

        <button id="price-filter-btn">Apply Price</button>

        <select id="sort-products">
            <option value="default">Sort Products</option>
            <option value="low-high">Price: Low to High</option>
            <option value="high-low">Price: High to Low</option>
        </select>

    </div>
    
    <p id="product-count"></p>

    <div id="no-products">
        No products found.
    </div>

    <div id="product-container"></div>
    </main>

    <div id="cart-panel">

        <div class="cart-header">
            <h2>Your Cart</h2>

            <button id="close-cart">×</button>
        </div>

        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart-footer">

            <p>
                Total:
                <strong>Rs. <span id="cart-total">0</span></strong>
            </p>

            <button id="checkout-btn">
                Checkout
            </button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
